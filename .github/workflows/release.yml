name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DesktopPilot-windows-x64-core
          path: release-assets
      - name: Validate version and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $project = Get-Content CMakeLists.txt -Raw
          if ($project -notmatch 'project\(DesktopPilot VERSION ([0-9]+\.[0-9]+\.[0-9]+)') { throw 'Missing project version' }
          if ($env:RELEASE_TAG -ne "v$($Matches[1])") { throw 'Tag and CMake version differ' }
          gh release create $env:RELEASE_TAG release-assets/DesktopPilot-windows-x64-core.zip release-assets/SHA256SUMS.txt --verify-tag --title "DesktopPilot $env:RELEASE_TAG" --notes-file .github/release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
