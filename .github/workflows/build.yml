name: Desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install cross-platform archive reader
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools
      - name: npm assembly and publishing tests
        run: npm test
  core:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: npm package tests
        run: npm test
      - name: Configure and build
        shell: pwsh
        run: |
          cmake --preset core-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset core-only --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Non-interactive regression tests
        run: ctest --preset core-only -LE interactive
      - name: Build C++ consumer
        shell: pwsh
        run: |
          cmake -S examples/cpp -B build/consumer -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/consumer --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build/consumer/Release/computer-pilot-example.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and smoke test
        shell: pwsh
        run: |
          cmake -DDP_BINARY_DIR=build/core/Release -DDP_PACKAGE_DIR=out/dist/ComputerPilot -P cmake/package.cmake
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & out/dist/ComputerPilot/bin/computer-pilot.exe capabilities
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & scripts/check-package.ps1 -Path out/dist/ComputerPilot
          Compress-Archive -Path out/dist/ComputerPilot -DestinationPath out/ComputerPilot-windows-x64-core.zip
          $hash = (Get-FileHash out/ComputerPilot-windows-x64-core.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ComputerPilot-windows-x64-core.zip" | Set-Content -Encoding ascii out/SHA256SUMS-windows.txt
      - name: npm global install and MCP smoke
        shell: pwsh
        run: |
          npm.cmd run prepare:npm -- --core out/dist/ComputerPilot --platform win32-x64 --out out/npm-smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd run smoke:npm -- --packages out/npm-smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Skills CLI install check
        run: npm run test:skills
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ComputerPilot-windows-x64-core
          path: |
            out/ComputerPilot-windows-x64-core.zip
            out/SHA256SUMS-windows.txt
          if-no-files-found: error

  macos-core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: npm package tests
        run: npm test
      - name: Configure and build macOS core
        run: |
          cmake --preset core-only
          cmake --build --preset core-only --parallel 4
      - name: Non-interactive macOS regression tests
        run: ctest --preset core-only -LE interactive
      - name: Check generated API reference
        shell: pwsh
        run: ./examples/onboarding/generate-reference.ps1 -Executable ./build/core/computer-pilot -Check
      - name: Build C++ consumer
        run: |
          cmake -S examples/cpp -B build/consumer -DCMAKE_BUILD_TYPE=Release
          cmake --build build/consumer --parallel 4
          ./build/consumer/computer-pilot-example
      - name: Package macOS core
        run: |
          cmake -DDP_BINARY_DIR=build/core -DDP_PACKAGE_DIR=out/dist/ComputerPilot-macos -P cmake/package.cmake
          ./out/dist/ComputerPilot-macos/bin/computer-pilot capabilities
      - name: Check macOS package
        shell: pwsh
        run: ./scripts/check-package.ps1 -Path out/dist/ComputerPilot-macos
      - name: Archive macOS arm64 package
        run: |
          test "$(uname -m)" = arm64
          mv out/dist/ComputerPilot-macos out/dist/ComputerPilot
          tar -czf out/ComputerPilot-macos-arm64-core.tar.gz -C out/dist ComputerPilot
          cd out
          shasum -a 256 ComputerPilot-macos-arm64-core.tar.gz > SHA256SUMS-macos.txt
      - name: npm global install and MCP smoke
        run: |
          npm run prepare:npm -- --core out/dist/ComputerPilot --platform darwin-arm64 --out out/npm-smoke
          npm run smoke:npm -- --packages out/npm-smoke
      - name: Skills CLI install check
        run: npm run test:skills
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ComputerPilot-macos-arm64-core
          path: |
            out/ComputerPilot-macos-arm64-core.tar.gz
            out/SHA256SUMS-macos.txt
          if-no-files-found: error
